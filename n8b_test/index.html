<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 포트폴리오 AI 챗봇 위젯</title>
  <style>
    :root {
      --primary-color: #4F46E5;
      --secondary-color: #818CF8;
      --bg-color: #F3F4F6;
      --chat-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-light: #6B7280;
    }

    body {
      font-family: 'Pretendard', 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
    }

    /* 화면 우측 하단에 뜨는 챗봇 둥근 아이콘 버튼 */
    .chat-widget-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
      z-index: 9999;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .chat-widget-button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
    }

    /* 챗봇 창 컨테이너 (기본적으로 숨겨짐) */
    .chat-container {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 350px;
      height: 550px;
      background-color: var(--chat-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 9998;
      
      /* 초기 상태는 숨김(투명도 0, 클릭 방지) */
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* open 클래스가 붙으면 나타남 */
    .chat-container.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .chat-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    /* 닫기 버튼 (X 아이콘) */
    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.bot {
      background-color: #F3F4F6;
      color: var(--text-main);
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .message.user {
      background-color: var(--primary-color);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .chat-input-area {
      padding: 15px;
      background-color: white;
      border-top: 1px solid #E5E7EB;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #E5E7EB;
      border-radius: 25px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .send-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s, background-color 0.2s;
    }

    .send-btn:hover {
      background-color: #4338CA;
      transform: scale(1.05);
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      background-color: #F3F4F6;
      padding: 12px 16px;
      border-radius: 15px;
      border-bottom-left-radius: 5px;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--text-light);
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <!-- 화면 우측 하단 둥근 챗봇 버튼 -->
  <div class="chat-widget-button" id="chatWidgetButton" onclick="toggleChat()">
    <svg id="widgetIcon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </div>

  <!-- 챗봇 대화창 (숨겨짐) -->
  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      홍길동 AI 어시스턴트 🤖
      <button class="close-btn" onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <!-- Messages will appear here -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="userInput" class="chat-input" placeholder="질문을 입력해주세요..."
        onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // UUID 생성 함수 (세션 ID용)
    function generateSessionId() {
      return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    // 세션 ID 확인 및 생성
    let sessionId = localStorage.getItem('chatbot_session_id');
    if (!sessionId) {
      sessionId = generateSessionId();
      localStorage.setItem('chatbot_session_id', sessionId);
    }

    // n8n Webhook URL (N8N 설정 후 아래 URL을 변경하세요)
    const WEBHOOK_URL = 'https://signectionlab.app.n8n.cloud/webhook-test/chat'; 

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const chatContainer = document.getElementById('chatContainer');
    const widgetIcon = document.getElementById('widgetIcon');

    let isChatOpen = false;
    let isInitialized = false; // 첫 인사를 한 번만 보내기 위함

    // 챗봇 창 열기/닫기 토글
    function toggleChat() {
      isChatOpen = !isChatOpen;
      
      if (isChatOpen) {
        chatContainer.classList.add('open');
        // 아이콘을 X 로 변경
        widgetIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
        
        // 창이 처음 열릴 때 초기 인사말 요청
        if (!isInitialized) {
          sendInitMessage();
          isInitialized = true;
        }
      } else {
        chatContainer.classList.remove('open');
        // 아이콘을 말풍선으로 복구
        widgetIcon.innerHTML = '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>';
      }
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);

      // 줄바꿈 처리
      msgDiv.innerHTML = text.replace(/\n/g, '<br>');

      chatMessages.insertBefore(msgDiv, typingIndicator);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
      typingIndicator.style.display = 'block';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
      typingIndicator.style.display = 'none';
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // 사용자 메시지 화면에 표시
      addMessage(text, 'user');
      userInput.value = '';
      
      showTyping();

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'sendMessage',
            message: text,
            sessionId: sessionId
          })
        });

        const data = await response.json();
        hideTyping();
        
        if (data && data.output) {
          addMessage(data.output, 'bot');
        } else {
          addMessage('응답 형식이 올바르지 않습니다.', 'bot');
        }

      } catch (error) {
        console.error('Error:', error);
        hideTyping();
        addMessage('서버와 통신하는 중 오류가 발생했습니다.', 'bot');
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // 초기 인사말 요청 함수
    async function sendInitMessage() {
      showTyping();
      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'sendMessage', message: 'init', sessionId: sessionId })
        });
        const data = await response.json();
        hideTyping();
        if (data && data.output) {
          addMessage(data.output, 'bot');
        }
      } catch (error) {
        hideTyping();
        addMessage('안녕하세요! 홍길동의 포트폴리오 AI 어시스턴트입니다 😊\n저에 대해 궁금하신 점을 물어보세요.\n(참고: n8n Webhook 연동 오류)', 'bot');
      }
    }
  </script>
</body>

</html>
