  <style>
    :root {
      --primary-color: #4F46E5;
      --secondary-color: #818CF8;
      --bg-color: #F3F4F6;
      --chat-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-light: #6B7280;
    }

    body {
      font-family: 'Pretendard', 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 400px;
      height: 600px;
      background-color: var(--chat-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.bot {
      background-color: #F3F4F6;
      color: var(--text-main);
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .message.user {
      background-color: var(--primary-color);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .chat-input-area {
      padding: 15px;
      background-color: white;
      border-top: 1px solid #E5E7EB;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #E5E7EB;
      border-radius: 25px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .send-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s, background-color 0.2s;
    }

    .send-btn:hover {
      background-color: #4338CA;
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      background-color: #F3F4F6;
      padding: 12px 16px;
      border-radius: 15px;
      border-bottom-left-radius: 5px;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--text-light);
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0);
      }

      40% {
        transform: scale(1);
      }
    }
  </style>
